<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Analysis</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --card-bg: #ffffff;
            --primary-color: #4a6cf7;
            --primary-hover: #3858d6;
            --text-main: #333333;
            --text-muted: #666666;
            --success-color: #2ec4b6;
            --border-color: #eef2f5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg-gradient); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { background-color: var(--card-bg); padding: 40px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08); width: 100%; max-width: 500px; text-align: center; animation: scaleUp 0.4s ease-out; }
        .icon-wrapper { width: 72px; height: 72px; background-color: rgba(46, 196, 182, 0.1); border-radius: 50%; display: flex; justify-content: center; align-items: center; margin: 0 auto 24px auto; }
        .icon-wrapper svg { width: 36px; height: 36px; color: var(--success-color); }
        h1 { color: var(--text-main); font-size: 24px; font-weight: 700; margin-bottom: 8px; }
        .subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 32px; }
        .result-display { background: linear-gradient(180deg, #fafbfc 0%, #f1f4f8 100%); border: 1px solid var(--border-color); border-radius: 16px; padding: 30px; margin-bottom: 32px; position: relative; overflow: hidden; }
        .result-display::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background-color: var(--success-color); }
        .result-label { font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); font-weight: 600; margin-bottom: 10px; }
        .score-container { display: inline-flex; align-items: baseline; justify-content: center; }
        .score { font-size: 64px; font-weight: 800; color: var(--text-main); line-height: 1; }
        .percentage-sign { font-size: 28px; font-weight: 700; color: var(--text-muted); margin-left: 2px; }
        .btn-stack { display: flex; flex-direction: column; gap: 12px; }
        .btn { display: block; width: 100%; padding: 16px; border-radius: 10px; font-size: 16px; font-weight: 600; text-decoration: none; transition: all 0.2s ease; cursor: pointer; border: none; text-align: center; }
        .btn-primary { background-color: var(--primary-color); color: white; box-shadow: 0 4px 12px rgba(74, 108, 247, 0.2); }
        .btn-primary:hover { background-color: var(--primary-hover); transform: translateY(-1px); box-shadow: 0 6px 15px rgba(74, 108, 247, 0.3); }
        .btn-secondary { background-color: transparent; color: var(--text-muted); border: 2px solid var(--border-color); }
        .btn-secondary:hover { background-color: #fafafa; color: var(--text-main); border-color: #dcdcdc; }
        @keyframes scaleUp { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        </div>
        <h1>Prediction Complete</h1>
        <p class="subtitle">The performance projection algorithm finished analyzing the records</p>
        <div class="result-display">
            <div class="result-label">Predicted Final Grade</div>
            <div class="score-container">
                <span class="score" id="predictionResult">0</span>
                <span class="percentage-sign">%</span>
            </div>
        </div>
        <div class="btn-stack">
            <a href="index.html" class="btn btn-primary">Check New Student</a>
            <button onclick="window.print()" class="btn btn-secondary">Print Report</button>
        </div>
    </div>
<script>

const params = new URLSearchParams(window.location.search);

const studyHours = Number(params.get("study_hours"));
const attendance = Number(params.get("attendance"));
const assignmentsCompleted = Number(params.get("assignments_completed"));
const sleepHours = Number(params.get("sleep_hours"));
const previousScore = Number(params.get("previous_score"));

let prediction =
    (studyHours * 5) +
    (attendance * 0.3) +
    (assignmentsCompleted * 2) +
    (sleepHours * 1.5) +
    (previousScore * 0.5);

prediction = Math.round(prediction);

if (prediction > 100) {
    prediction = 100;
}

document.getElementById("predictionResult").innerText = prediction;

</script>
</body>
</html>
